name = "unistay-cn"
main = "worker/index.ts"
compatibility_date = "2024-01-01"
[assets]
directory = "./dist"
binding = "ASSETS"

# 运行时文章层（R254，d1_runtime_scaffold 生成）。只存还没进构建产物的
# 新文章，静态正本优先。刻意不设 run_worker_first：Worker 只接管构建产物里
# 根本不存在的路径（云构建等价闸按 dist manifest 逐文件核 sha256）。
[[d1_databases]]
binding = "DB"
database_name = "unistay-cn-content"
database_id = "23977d52-92cf-4c87-a861-99d058fd7f46"
